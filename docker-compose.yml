# The whole site on one server: the database, the site, HTTPS, the indexer timer and backups.
# Settings come from .env next to this file (copy deploy/server.env.example). See README, «Сервер».
name: basilisk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: basilisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: basilisk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basilisk -d basilisk"]
      interval: 5s
      retries: 20
    # No ports: only the site and the backups reach the database, never the internet.
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://basilisk:${POSTGRES_PASSWORD}@db:5432/basilisk
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # One indexer pass every few minutes, even when nobody visits (visitors start passes too).
  indexer:
    image: curlimages/curl:8.11.1
    environment:
      INDEXER_SECRET: ${INDEXER_SECRET:?set INDEXER_SECRET in .env}
      EVERY: ${INDEXER_EVERY_SECONDS:-180}
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep "$$EVERY"
          curl -fsS -m 120 -o /dev/null -H "Authorization: Bearer $$INDEXER_SECRET" http://app:3000/api/indexer \
            || echo "[indexer] pass failed (the site may still be building)"
        done
    depends_on:
      - app
    restart: unless-stopped

  # A copy of the database every night into ./backups, the last 14 kept.
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 60
          pg_dump -h db -U basilisk basilisk | gzip > "/backups/basilisk-$$(date +%F).sql.gz" \
            && find /backups -name '*.sql.gz' -mtime +14 -delete \
            && echo "[backup] saved basilisk-$$(date +%F).sql.gz"
          sleep 86340
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
